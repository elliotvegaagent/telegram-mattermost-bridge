[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "telegram-mattermost-bridge"
version = "0.4.0"
description = "Durable Telegram group to Mattermost channel bridge"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "aiohttp>=3.11,<4",
]

[project.optional-dependencies]
test = [
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.25,<2",
]

[project.scripts]
telegram-mattermost-bridge = "bridge.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/bridge"]

[tool.hatch.build]
include = [
  "src/bridge/**/*.py",
  "src/bridge/migrations/*.sql",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
